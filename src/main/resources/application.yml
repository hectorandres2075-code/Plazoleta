spring:
  application:
    name: plazoleta
  datasource:
    # H2 en memoria para empezar. Luego se cambia a MySQL/PostgreSQL solo tocando esto.
    url: jdbc:h2:mem:plazoleta;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:cambia-este-secreto-por-uno-largo-de-minimo-32-caracteres}
  expiration-ms: 3600000

server:
  port: 8082

# Dirección del microservicio de Usuarios (lo usaremos para validar propietarios)
usuarios:
  base-url: http://localhost:8081
